<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="uf-token" content="__UF_TOKEN__">
<meta name="color-scheme" content="dark">
<title>UsageForge</title>
<link rel="icon" href="/assets/usageforge-mark.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Jost"; src: url("/assets/fonts/jost-var-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }

:root {
  /* Deep space, star dust, and the light of the disk. */
  --void: #04060c; --hull: #0b0f17; --hull-2: #10151f; --hull-3: #161c29;
  --ink: #e8ecf4; --ink-2: #b8c1d2; --muted: #8b95aa; --faint: #7a849a;
  --line: rgba(168, 186, 224, 0.11); --line-2: rgba(168, 186, 224, 0.22);
  --ember: #d27a5f; --gold: #f3b46a; --hot: #ffe2b0; --ring: #bcd7ff; --flare: #ff7a6b;
  --gold-ink: #1b1308;
  --sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --r: 10px; --r-sm: 7px;
  --gutter: max(clamp(16px, 4vw, 44px), calc((100% - 1320px) / 2));
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--void); color-scheme: dark; scrollbar-color: var(--hull-3) var(--void); }
/* The sky's faint field of dots carries on down the page. */
body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle, rgba(127, 141, 176, 0.13) 0.75px, transparent 1.25px) 0 0 / 14px 14px, var(--void); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 500; line-height: 1.15; letter-spacing: -0.005em; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
button, input, textarea { font: inherit; color: inherit; }
::selection { background: rgba(243, 180, 106, 0.32); color: var(--ink); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--hull-3); border-radius: 10px; border: 2px solid var(--void); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
svg.i { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- The sky: the background check as a black hole ---------- */
.sky { position: relative; height: 400px; overflow: hidden; border-bottom: 1px solid var(--line); }
/* The author's black hole, a looping image: the browser plays it, nothing is computed here. */
.hole { position: absolute; top: 50%; left: 50%; width: min(960px, 72%); height: auto; transform: translate(-40%, -50%);   /* a little right of centre */ display: block; user-select: none; pointer-events: none;
  -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent); mask-image: radial-gradient(closest-side, #000 72%, transparent); transition: opacity 0.4s; }
.hole.still { opacity: 0.55; }
.sky-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px var(--gutter) 0; }
.brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-size: 19px; font-weight: 500; letter-spacing: 0.01em; }
.brand img { width: 44px; height: 24px; image-rendering: pixelated; }
.link { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 14.5px; text-decoration: none; }
.link:hover { color: var(--ink); }
.engine { position: absolute; z-index: 1; left: var(--gutter); bottom: 34px; max-width: min(520px, 46%); }
.engine-state { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; }
.engine-next { margin-top: 10px; color: var(--ink-2); font-size: 15px; }
.dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--faint); }
.on > .dot { background: var(--gold); box-shadow: 0 0 0 4px rgba(243, 180, 106, 0.14); }

/* ---------- Layout ---------- */
main { padding: 8px var(--gutter) 72px; }
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 44px; }
/* No cards: each part sits on the night ground, opened by a hairline. */
.panel { border-top: 1px solid var(--line-2); }
.sec { padding: 20px 22px; border-top: 1px solid var(--line); }
.q { margin-bottom: 12px; color: var(--ink); font-size: 15.5px; font-weight: 500; }
.q small { display: block; margin-top: 2px; color: var(--muted); font-size: 13.5px; font-weight: 400; }

/* Tool header */
.tool-head { display: flex; align-items: center; gap: 14px; padding: 20px 22px; }
.icon, .tile { width: 42px; height: 42px; flex: none; border-radius: 10px; }
.tile { display: grid; place-items: center; font-weight: 600; font-size: 15px; color: var(--gold-ink); background: var(--gold); }
.tool-head > div { flex: 1 1 auto; min-width: 0; }
.tool-head h2 { font-size: 23px; }
.tool-head .sub { margin-top: 1px; color: var(--muted); font-size: 13.5px; }
.tool-head .sub.warn { color: var(--gold); }
.state { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); font-size: 13.5px; white-space: nowrap; }

/* Meters: a row of dots that light up like the disk */
.meters { display: grid; gap: 14px; padding: 0 22px 20px; }
.meter { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px 12px; }
.meter .name { color: var(--ink-2); font-size: 14px; }
.meter .val { color: var(--muted); font-size: 13px; white-space: nowrap; }
.meter .val b { color: var(--ink); font-weight: 500; }
.dots { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; }
.dots i { aspect-ratio: 1; max-height: 11px; justify-self: center; width: 100%; max-width: 11px; border-radius: 50%; background: rgba(168, 186, 224, 0.12); transition: background 0.25s; }
.dots i.on { background: var(--gold); }
.dots i.on:nth-child(n+8) { background: #f6c27c; } .dots i.on:nth-child(n+14) { background: var(--hot); }
.dots.high i.on { background: var(--ember); }
.dots.full i.on { background: var(--flare); }
/* The panel lost its server: the numbers are a snapshot, so they step back until it reconnects. */
body.stale .meter { opacity: 0.4; }

/* Mode: three choices in one row */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.mode { display: grid; align-content: start; gap: 4px; padding: 12px 14px; text-align: left; cursor: pointer; border: 0; border-left: 1px solid var(--line); background: transparent; transition: background 0.2s; }
.mode:first-child { border-left: 0; }
.mode:hover { background: rgba(168, 186, 224, 0.05); }
.mode:focus-visible { outline-offset: -3px; }
.mode .glyph { display: flex; gap: 3px; height: 8px; margin-bottom: 6px; }
.mode .glyph i { width: 8px; height: 8px; border-radius: 50%; background: rgba(168, 186, 224, 0.18); }
.mode .glyph i.a { background: var(--gold); }
.mode b { font-size: 15px; font-weight: 500; }
.mode span { color: var(--muted); font-size: 13px; line-height: 1.4; }
.mode[aria-checked="true"] { background: rgba(243, 180, 106, 0.1); box-shadow: inset 0 -2px 0 var(--gold); }
.mode[aria-checked="true"] b { color: var(--hot); }

/* The day: one bar for 24 hours, on a field of dots. Windows are blocks you add, drag and remove. */
.day { position: relative; margin-top: 4px; user-select: none; -webkit-user-select: none; }
.zones { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 6px; color: var(--faint); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
.zones span { padding-left: 6px; border-left: 1px solid var(--line); }
.bar {
  position: relative; height: 76px; cursor: pointer; border-radius: var(--r-sm); overflow: hidden;
  background:
    radial-gradient(circle, rgba(168, 186, 224, 0.2) 1px, transparent 1.5px) 0 0 / calc(100% / 48) 12px,
    linear-gradient(90deg, rgba(0, 0, 0, 0.35) 0 25%, transparent 25% 87.5%, rgba(0, 0, 0, 0.25) 87.5%),
    var(--void);
  box-shadow: inset 0 0 0 1px var(--line-2);
}
.bar.ro, .bar.ro .band { cursor: default; }
.bar.ro .band { padding-right: 8px; }   /* no × to make room for */
.bar.watch { background: radial-gradient(circle, rgba(168, 186, 224, 0.2) 1px, transparent 1.5px) 0 0 / calc(100% / 48) 12px, var(--void); }
.bar:not(.ro):hover { box-shadow: inset 0 0 0 1px rgba(188, 215, 255, 0.45); }
.ghosthour { position: absolute; top: 0; bottom: 0; width: calc(100% / 24); background: rgba(188, 215, 255, 0.1); pointer-events: none; opacity: 0; transition: opacity 0.15s; }
.bar:not(.ro):hover .ghosthour { opacity: 1; }
.band {
  position: absolute; top: 9px; bottom: 9px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
  padding: 0 26px 0 11px; overflow: hidden; white-space: nowrap; cursor: grab; touch-action: none; border-radius: 6px;
  color: var(--gold-ink); background: linear-gradient(90deg, var(--hot), var(--gold) 45%, rgba(210, 122, 95, 0.85));
}
.band b, .band span { overflow: hidden; text-overflow: ellipsis; }
.band b { font: 600 13.5px/1 var(--mono); }
.band b.short { display: none; }
.band span { font: 500 11.5px/1 var(--mono); opacity: 0.72; }
.band.dragging { cursor: grabbing; opacity: 0.88; outline: 2px solid var(--ring); }
.band.bad { background: rgba(255, 122, 107, 0.6); }
.band.ghost { padding-right: 8px; color: var(--hot); background: rgba(243, 180, 106, 0.14); box-shadow: inset 0 0 0 1px rgba(243, 180, 106, 0.3); cursor: default; }
.band .x { position: absolute; top: 5px; right: 5px; display: grid; place-items: center; width: 18px; height: 18px; border: 0; padding: 0; border-radius: 50%; cursor: pointer; color: var(--gold-ink); background: rgba(27, 19, 8, 0.14); }
.band .x:hover { background: rgba(27, 19, 8, 0.32); }
.band .x svg { width: 10px; height: 10px; stroke-width: 2; }
.nowline { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ring); pointer-events: none; }
.nowline span { position: absolute; bottom: 4px; left: 6px; padding: 2px 6px; border-radius: 4px; font: 600 10.5px/1 var(--sans); letter-spacing: 0.06em; color: var(--void); background: var(--ring); }
.empty-bar { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: 14px; pointer-events: none; }
.ticks { position: relative; height: 14px; margin-top: 8px; color: var(--faint); font: 500 11px/1 var(--mono); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; } .ticks span:last-child { transform: translateX(-100%); }

/* Repeat days: a dropdown, closed until you need it */
.repeat { position: relative; }
.repeat summary { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 999px; cursor: pointer; list-style: none; color: var(--muted); font-size: 13.5px; }
.repeat summary::-webkit-details-marker { display: none; }
.repeat summary b { color: var(--ink); font-weight: 500; }
.repeat summary:hover { border-color: rgba(168, 186, 224, 0.36); }
.repeat[open] summary svg { transform: rotate(180deg); }
.repeat-menu { position: absolute; z-index: 30; top: calc(100% + 8px); left: 0; display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--hull-2); box-shadow: 0 18px 40px -18px #000; }
.days { display: flex; gap: 5px; }
.days button { width: 32px; height: 32px; padding: 0; border: 1px solid var(--line-2); border-radius: 50%; cursor: pointer; color: var(--muted); background: transparent; font-size: 12.5px; font-weight: 500; transition: background 0.2s, color 0.2s, border-color 0.2s; }
.days button[aria-pressed="true"] { color: var(--gold-ink); border-color: var(--gold); background: var(--gold); }
.presets { display: flex; gap: 2px; }
.presets button { padding: 6px 9px; border: 0; border-radius: 6px; cursor: pointer; color: var(--muted); background: none; font-size: 13px; }
.presets button:hover { color: var(--ink); background: rgba(168, 186, 224, 0.06); }
.extra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 16px; }
.exact { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; background: none; cursor: pointer; color: var(--ring); font-size: 13.5px; }
.exact:hover { color: var(--ink); }
.adder { display: inline-flex; gap: 8px; vertical-align: middle; }

input[type="time"], input[type="text"], textarea { padding: 8px 11px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--void); color: var(--ink); caret-color: var(--gold); transition: border-color 0.2s; }
input[type="time"] { font-family: var(--mono); font-variant-numeric: tabular-nums; color-scheme: dark; }
input:hover, textarea:hover { border-color: rgba(168, 186, 224, 0.34); }
input:focus-visible, textarea:focus-visible { outline: 0; border-color: var(--ring); box-shadow: 0 0 0 3px rgba(188, 215, 255, 0.16); }
input.bad { border-color: var(--flare); }
input:disabled { opacity: 0.5; }
textarea { width: 100%; min-height: 64px; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--faint); }

/* Message and model */

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 8px 15px; border: 1px solid transparent; border-radius: var(--r-sm); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--gold-ink); background: var(--gold); transition: background 0.2s, border-color 0.2s, transform 0.15s var(--ease); white-space: nowrap; }
.btn:hover { background: #ffc887; }
.btn:active { transform: translateY(1px); }
.btn:disabled { cursor: not-allowed; opacity: 0.45; }
.btn.ghost { color: var(--ink); background: transparent; border-color: var(--line-2); }
.btn.ghost:hover { background: rgba(168, 186, 224, 0.06); border-color: rgba(168, 186, 224, 0.36); }

/* Health banner: what `usageforge doctor` says needs fixing */
.health { display: grid; gap: 6px; margin-bottom: 18px; padding: 14px 18px; border: 1px solid rgba(255, 122, 107, 0.45); border-radius: var(--r); background: rgba(255, 122, 107, 0.07); }
.health b { font-weight: 500; }
.health ul { margin: 0; padding: 0; }
.health li { margin-left: 18px; color: var(--ink-2); font-size: 14px; }

/* Switch */
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch i { position: relative; width: 38px; height: 22px; flex: none; border-radius: 999px; background: rgba(168, 186, 224, 0.16); transition: background 0.2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 0.2s var(--ease), background 0.2s; }
.switch input:checked + i { background: rgba(243, 180, 106, 0.32); }
.switch input:checked + i::after { transform: translateX(16px); background: var(--gold); }
.switch input:focus-visible + i { outline: 2px solid var(--ring); outline-offset: 3px; }

/* Sleep and wake */
.night { margin-top: 26px; padding: 20px 22px 22px; }
.night h2 { margin-bottom: 14px; font-size: 23px; }
.nrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; min-height: 40px; }
.nrows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 88px; align-items: start; }   /* the right column lines up with Codex above */
.nrow .switch { min-width: 220px; color: var(--ink); font-size: 15px; }
.nrow .note { color: var(--muted); font-size: 14px; }
.nrow .note b { color: var(--ink-2); font-weight: 500; }
.hours { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }

/* Activity */
.activity { margin-top: 26px; }
.activity .head2 { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
.activity h3 { font-size: 17px; }
.synced { margin-left: auto; color: var(--faint); font-size: 12.5px; }
.filter { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
.filter button { padding: 5px 12px; border: 0; border-radius: 999px; cursor: pointer; color: var(--muted); background: none; font-size: 13px; }
.filter button[aria-pressed="true"] { color: var(--gold-ink); background: var(--gold); }
.loglines { padding: 12px 22px 18px; max-height: 300px; overflow: auto; font: 12.5px/1.8 var(--mono); color: var(--ink-2); }
.loglines div { white-space: pre-wrap; overflow-wrap: anywhere; }
.loglines .t { color: var(--faint); }
.loglines .bad { color: var(--flare); }
.loglines .ok { color: var(--gold); }
.empty { padding: 18px 0; color: var(--muted); font: 400 14px/1.5 var(--sans); text-align: center; }

.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: grid; gap: 8px; }
.toast { padding: 10px 14px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--hull-3); color: var(--ink); font-size: 14px; box-shadow: 0 18px 40px -18px #000; animation: rise 0.3s var(--ease); }
.toast.bad { border-color: rgba(255, 122, 107, 0.6); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* Guide: a short tour the first time the panel opens, and from "Guide". The page stays usable underneath. */
.guide-dim { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.guide-dim.full { background: rgba(3, 4, 8, 0.74); pointer-events: auto; }
.guide-spot { position: fixed; z-index: 60; pointer-events: none; border-radius: 12px; box-shadow: 0 0 0 200vmax rgba(3, 4, 8, 0.72), inset 0 0 0 2px var(--ring); }
.guide-card { position: fixed; z-index: 61; width: min(380px, calc(100vw - 32px)); overflow: hidden; border: 1px solid var(--line-2); border-radius: 12px; background: var(--hull-2); box-shadow: 0 30px 60px -24px #000; animation: rise 0.3s var(--ease); }
.guide-card.wide { width: min(560px, calc(100vw - 32px)); }
.guide-card .art { display: block; width: 100%; height: auto; background: var(--void); }
.guide-card .body { padding: 20px 22px; }
.guide-card h3 { margin-bottom: 8px; font-size: 24px; }
.guide-card p.text { color: var(--ink-2); font-size: 14.5px; }
.guide-card p.text b { color: var(--ink); font-weight: 500; }
.guide-card .nav { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
.guide-card .pips { display: flex; gap: 5px; margin-right: auto; }
.guide-card .pips i { width: 7px; height: 7px; border-radius: 50%; background: rgba(168, 186, 224, 0.2); }
.guide-card .pips i.on { background: var(--gold); }
.guide-card .skip { padding: 8px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 14px; }
.guide-card .skip:hover { color: var(--ink); }

.hidden { display: none !important; }

@media (max-width: 1080px) { .panels { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .sky { height: auto; }
  .hole { position: relative; top: auto; left: auto; width: 100%; transform: none; margin-top: 40px; }
  .sky-top { position: absolute; inset: 0 0 auto; padding-top: 16px; }
  .engine { position: relative; left: auto; bottom: auto; max-width: none; padding: 4px var(--gutter) 22px; }
  .tool-head { flex-wrap: wrap; } .tool-head > div { flex-basis: calc(100% - 56px); } .state { margin-left: 56px; }
  .band b.long { display: none; } .band b.short { display: block; } .bar.ro .band { padding: 0 4px 0 6px; } .band b.short { font-size: 11.5px; }
  .engine-state { font-size: 28px; }
  .sec, .tool-head, .night-head, .night-body { padding-left: 16px; padding-right: 16px; }
  .meters { padding: 0 16px 18px; }
  .modes { grid-template-columns: 1fr; } .mode { border-left: 0; border-top: 1px solid var(--line); } .mode:first-child { border-top: 0; }
  .band { padding: 0 22px 0 6px; } .band span { display: none; } .band b { font-size: 12px; }
  .ticks span:nth-child(even) { display: none; }
  .zones { letter-spacing: 0.02em; }
  .synced { margin-left: 0; }
  .nrows { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
</svg>

<header class="sky" id="sky">
  <img class="hole" id="hole" src="/assets/black-hole.gif" alt="" width="1600" height="896" decoding="async">
  <div class="sky-top">
    <a class="brand" href="/"><img src="/assets/usageforge-mark.svg" width="44" height="24" alt="">UsageForge</a>
    <button type="button" class="link" id="guide-btn">Guide</button>
  </div>
  <div class="engine hidden" id="engine" role="status">
    <p class="engine-state"><span class="dot"></span><span class="engine-text">Reconnecting…</span></p>
    <p class="engine-next" id="engine-next"></p>
  </div>
</header>

<main>
  <div class="health hidden" id="health" role="alert"></div>
  <div class="panels" id="panels"></div>

  <section class="night panel" id="night" aria-labelledby="night-title">
    <h2 id="night-title">Sleep and wake</h2>
    <div class="nrows">
    <div class="nrow">
      <label class="switch"><input type="checkbox" id="sleep-on"><i></i>Sleep when work is done</label>
      <span class="hours" id="sleep-hours"><input type="time" id="night-from" value="23:30" aria-label="Sleep from">to<input type="time" id="night-to" value="08:00" aria-label="Sleep until"></span>
    </div>
    <div class="nrow">
      <label class="switch"><input type="checkbox" id="wake-on"><i></i>Wake for set times</label>
      <span class="note" id="wake-note"></span>
      <button type="button" class="btn ghost hidden" id="allow-btn">Allow</button>
    </div>
    </div>
  </section>

  <section class="activity panel" aria-labelledby="act-title">
    <div class="head2">
      <h3 id="act-title">Activity</h3>
      <div class="filter" id="logfilter" role="group" aria-label="Filter activity">
        <button type="button" data-v="all" aria-pressed="true">All</button>
        <button type="button" data-v="claude" aria-pressed="false">Claude</button>
        <button type="button" data-v="codex" aria-pressed="false">Codex</button>
      </div>
      <span class="synced" id="synced"></span>
    </div>
    <div class="loglines" id="log"></div>
  </section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<template id="tool-tpl">
  <article class="tool panel">
    <header class="tool-head">
      <span class="tile"></span>
      <div><h2 class="name"></h2><p class="sub"></p></div>
      <p class="state"><span class="dot"></span><span class="state-text"></span></p>
    </header>

    <div class="meters">
      <div class="meter"><span class="name">This 5-hour window</span><span class="val five-val"></span><div class="dots five"></div></div>
      <div class="meter"><span class="name">This week</span><span class="val week-val"></span><div class="dots week"></div></div>
    </div>

    <div class="sec">
      <p class="q">How should it start your windows?</p>
      <div class="modes" role="radiogroup">
        <button type="button" class="mode" role="radio" data-v="off"><span class="glyph"><i></i><i></i><i></i><i></i><i></i></span><b>Off</b><span>Don't send anything.</span></button>
        <button type="button" class="mode" role="radio" data-v="schedule"><span class="glyph"><i class="a"></i><i></i><i></i><i class="a"></i><i></i></span><b>At set times</b><span>Start a window at the times you pick.</span></button>
        <button type="button" class="mode" role="radio" data-v="watch"><span class="glyph"><i class="a"></i><i class="a"></i><i class="a"></i><i class="a"></i><i class="a"></i></span><b>Back to back</b><span>Start a new window the moment one ends.</span></button>
      </div>
    </div>

    <div class="sec plan">
      <p class="q plan-q"></p>
      <div class="day">
        <div class="zones"><span>Night</span><span>Morning</span><span>Afternoon</span><span>Evening</span></div>
        <div class="bar"></div>
        <div class="ticks"></div>
      </div>
      <div class="when">
        <div class="extra">
          <details class="repeat">
            <summary>Repeat <b class="repeat-val"></b><svg class="i"><use href="#i-down"/></svg></summary>
            <div class="repeat-menu">
              <div class="days" role="group" aria-label="Days"></div>
              <div class="presets">
                <button type="button" data-p="0,1,2,3,4,5,6">Every day</button>
                <button type="button" data-p="1,2,3,4,5">Weekdays</button>
                <button type="button" data-p="0,6">Weekends</button>
              </div>
            </div>
          </details>
          <button type="button" class="exact"><svg class="i"><use href="#i-plus"/></svg>Add an exact time</button>
          <span class="adder hidden">
            <input type="time" class="new-time" value="06:00" aria-label="Time to add">
            <button type="button" class="btn ghost add-time">Add</button>

        </div>
      </div>
    </div>
  </article>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name="uf-token"]').content;
const TOOLS = {
  claude: { name: "Claude Code", tile: "CC", placeholder: "haiku (default)" },
  codex: { name: "Codex", tile: "CX", placeholder: "Codex default" },
};
const DAYS = [[1, "M"], [2, "T"], [3, "W"], [4, "T"], [5, "F"], [6, "S"], [0, "S"]];
const DAY_NAMES = ["Sundays", "Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays"];
const DEFAULT = { mode: "off", times: ["06:00"], days: [0, 1, 2, 3, 4, 5, 6], prompt: "", model: "" };
const NIGHT = { sleep: false, wake: true, from: "23:30", to: "08:00" };
const WINDOW = 5 * 60; // minutes
const STILL = matchMedia("(prefers-reduced-motion: reduce)");

let state = null;
let config = { claude: { ...DEFAULT }, codex: { ...DEFAULT }, night: { ...NIGHT } };
let saveTimer = 0;
let logFilter = "all";
const els = {};
const icon = (id) => `<svg class="i"><use href="#i-${id}"/></svg>`;

// ---------- API ----------
async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-UF-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function toast(text, bad = false) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = text;
  document.getElementById("toasts").append(t);
  setTimeout(() => t.remove(), 2600);
}

// ---------- Time helpers (shown in the viewer's own 12h/24h format) ----------
const pad = (n) => String(n).padStart(2, "0");
const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = (m) => `${pad(Math.floor(((m % 1440) + 1440) % 1440 / 60))}:${pad(((m % 60) + 60) % 60)}`;
const clock = (m) => new Date(2000, 0, 1, 0, ((m % 1440) + 1440) % 1440).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const clockTs = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const when = (ts) => {
  const d = new Date(ts * 1000);
  return d.toDateString() === new Date().toDateString() ? clockTs(ts) : `${d.toLocaleDateString([], { weekday: "short" })} ${clockTs(ts)}`;
};
// A compact time ("6a", "11:12p") for blocks too narrow for "11:12 PM" at phone width.
const shortClock = (m) => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), r = m % 60; return `${h % 12 || 12}${r ? ":" + pad(r) : ""}${h < 12 ? "a" : "p"}`; };
const nowMins = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

function dotRow(el, pct) {
  const on = pct == null ? 0 : Math.round(Math.min(100, Math.max(0, pct)) / 5);
  el.innerHTML = "";
  for (let i = 0; i < 20; i++) { const c = document.createElement("i"); if (i < on) c.className = "on"; el.append(c); }
  el.classList.toggle("high", pct >= 75 && pct < 100);
  el.classList.toggle("full", pct >= 100);
}

function daysText(days) {
  const s = [...days].sort().join(",");
  if (s === "0,1,2,3,4,5,6") return "every day";
  if (s === "1,2,3,4,5") return "on weekdays";
  if (s === "0,6") return "on weekends";
  return "on " + days.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map((d) => DAY_NAMES[d]).join(", ");
}

// ---------- The 24-hour bar ----------
const wrap = (m) => ((m % 1440) + 1440) % 1440;
// The time in `times` (other than `skip`) whose window overlaps one starting at minute m, if any.
function clash(times, m, skip) {
  return times.find((t) => t !== skip && (wrap(m - mins(t)) < WINDOW || wrap(mins(t) - m) < WINDOW));
}

// items: [{start, len, title, sub, ghost, t}]. origin: minute of day at the left edge
// (midnight for set times, "now" for back to back).
function drawDay(node, items, { origin = 0, editable = false } = {}) {
  const bar = node.querySelector(".bar");
  bar.innerHTML = "";
  bar.classList.toggle("ro", !editable);
  bar.classList.toggle("watch", origin !== 0);
  node.querySelector(".zones").classList.toggle("hidden", origin !== 0);
  const left = (m) => `${(wrap(m - origin) / 1440) * 100}%`;
  for (const it of items) {
    const start = wrap(it.start - origin);
    // A window that runs past the right edge continues at the left (midnight) or is cut (next 24 hours).
    const pieces = start + it.len > 1440 ? (origin ? [[start, 1440]] : [[start, 1440], [0, start + it.len - 1440]]) : [[start, start + it.len]];
    for (const [a, b] of pieces) {
      const band = document.createElement("div");
      band.className = "band" + (it.ghost ? " ghost" : "");
      band.style.left = `${(a / 1440) * 100}%`; band.style.width = `${((b - a) / 1440) * 100}%`;
      if (it.t) band.dataset.t = it.t;
      // A sliver too narrow for its label (or a window cut off by the edge) keeps it as a tooltip.
      if (a === start && ((it.len < 100 && it.ghost) || b - a < it.len / 2)) band.title = it.title;
      else if (a === start) {
        const t = document.createElement("b"); t.textContent = it.title; t.className = "long"; band.title ||= it.title;
        // At phone width a block is too narrow for "11:00 AM", so it shows "11a".
        const short = document.createElement("b"); short.className = "short"; short.textContent = it.short ?? it.title;
        const sub = document.createElement("span"); sub.textContent = it.sub || "";
        band.append(t, short, sub);
        if (editable) {
          const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.innerHTML = icon("x");
          x.setAttribute("aria-label", `Remove ${it.title}`); band.append(x);
          band.title = `${it.title}: drag to move`;
        }
      }
      bar.append(band);
    }
  }
  if (!items.length && editable) {
    const e = document.createElement("div"); e.className = "empty-bar"; e.textContent = "Click the hour you want your first window to start"; bar.append(e);
  }
  if (!origin) {
    const now = document.createElement("div"); now.className = "nowline"; now.style.left = left(nowMins());
    const tag = document.createElement("span"); tag.textContent = "now"; now.append(tag); bar.append(now);
  }
  if (editable) { const g = document.createElement("div"); g.className = "ghosthour"; bar.append(g); }
  const ticks = node.querySelector(".ticks");
  ticks.innerHTML = "";
  // Midnight-based days get a tick every 3 hours; "next 24 hours" ticks fall on odd minutes, so space them out.
  for (let k = 0; k <= 1440; k += origin ? 360 : 180) {
    const span = document.createElement("span");
    span.style.left = `${(k / 1440) * 100}%`;
    span.textContent = origin && k === 0 ? "Now" : clock(origin + k).replace(":00", "");
    ticks.append(span);
  }
}

// ---------- Rendering ----------
function build() {
  const tpl = document.getElementById("tool-tpl");
  for (const tool of Object.keys(TOOLS)) {
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.dataset.tool = tool;
    const q = (s) => node.querySelector(s);

    // The tool's own app icon when available, letters otherwise.
    const img = new Image(); img.className = "icon"; img.alt = ""; img.src = `/icons/${tool}.png`;
    img.onload = () => q(".tile").replaceWith(img);
    q(".tile").textContent = TOOLS[tool].tile;
    q(".name").textContent = TOOLS[tool].name;
    q(".modes").setAttribute("aria-label", `${TOOLS[tool].name}: how to start windows`);
    for (const [v, label] of DAYS) {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.v = v; b.textContent = label;
      b.setAttribute("aria-label", DAY_NAMES[v].slice(0, -1));
      q(".days").append(b);
    }

    q(".modes").addEventListener("click", (e) => {
      const b = e.target.closest(".mode"); if (!b) return;
      config[tool].mode = b.dataset.v; renderTool(tool); save();
    });
    const addTime = (t) => {
      const c = config[tool];
      if (c.times.includes(t)) return toast(`${clock(mins(t))} is already set`);
      const hit = clash(c.times, mins(t));
      if (hit) return toast(`${clock(mins(t))} is inside your ${clock(mins(hit))} window. Try ${clock(mins(hit) + WINDOW)} or later.`, true);
      if (c.times.length >= 12) return toast("Up to 12 times", true);
      c.times = [...c.times, t].sort((a, b) => mins(a) - mins(b));
      renderTool(tool); save();
    };
    q(".exact").addEventListener("click", () => { q(".adder").classList.toggle("hidden"); q(".new-time").focus(); });
    q(".new-time").addEventListener("keydown", (e) => { if (e.key === "Enter") q(".add-time").click(); });
    q(".add-time").addEventListener("click", () => {
      const t = q(".new-time").value;
      if (!/^\d\d:\d\d$/.test(t)) return toast("Pick a time first", true);
      addTime(t);
    });

    // The bar is the editor: click an empty hour to add, drag a window to move it, × to remove.
    const bar = q(".bar");
    const hourAt = (x) => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(23, Math.floor(((x - r.left) / r.width) * 24))); };
    let drag = null;
    bar.addEventListener("pointermove", (e) => {
      const g = bar.querySelector(".ghosthour");
      if (g && !drag) g.style.left = `${(hourAt(e.clientX) / 24) * 100}%`;
      if (!drag) return;
      const r = bar.getBoundingClientRect();
      const delta = Math.round((((e.clientX - drag.x) / r.width) * 1440) / 15) * 15;
      drag.to = wrap(mins(drag.t) + delta);
      drag.moved = drag.moved || Math.abs(e.clientX - drag.x) > 4;
      const bad = !!clash(config[tool].times, drag.to, drag.t);
      for (const b of drag.bands) {
        b.classList.add("dragging"); b.classList.toggle("bad", bad);
        b.style.transform = `translateX(${(delta / 1440) * r.width}px)`;
      }
      const label = drag.bands[0].querySelector("b"); if (label) label.textContent = clock(drag.to);
    });
    bar.addEventListener("pointerdown", (e) => {
      const band = e.target.closest(".band[data-t]");
      if (!band || e.target.closest(".x") || config[tool].mode !== "schedule") return;
      drag = { t: band.dataset.t, x: e.clientX, to: mins(band.dataset.t), moved: false, bands: [...bar.querySelectorAll(`.band[data-t="${band.dataset.t}"]`)] };
      bar.setPointerCapture(e.pointerId);
    });
    const endDrag = () => {
      if (!drag) return;
      const d = drag; drag = null;
      if (!d.moved) return renderTool(tool);
      // The click that follows belongs to this drag, not to "add a time". It may never come (the bar is redrawn).
      bar.dataset.justDragged = "1"; setTimeout(() => delete bar.dataset.justDragged);
      const c = config[tool];
      const hit = clash(c.times, d.to, d.t);
      const to = hhmm(d.to);
      if (hit) { toast(`That overlaps your ${clock(mins(hit))} window`, true); return renderTool(tool); }
      if (to === d.t) return renderTool(tool);
      c.times = c.times.map((t) => (t === d.t ? to : t)).sort((a, b) => mins(a) - mins(b));
      renderTool(tool); save();
    };
    bar.addEventListener("pointerup", endDrag);
    bar.addEventListener("pointercancel", endDrag);
    bar.addEventListener("click", (e) => {
      if (bar.dataset.justDragged) { delete bar.dataset.justDragged; return; }
      if (config[tool].mode !== "schedule") return;
      const x = e.target.closest(".x");
      if (x) {
        const t = x.closest(".band").dataset.t;
        config[tool].times = config[tool].times.filter((v) => v !== t);
        return renderTool(tool), save();
      }
      if (e.target.closest(".band")) return;
      addTime(`${pad(hourAt(e.clientX))}:00`);
    });
    q(".days").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const v = Number(b.dataset.v), c = config[tool];
      if (c.days.includes(v) && c.days.length === 1) return toast("Keep at least one day", true);
      c.days = c.days.includes(v) ? c.days.filter((d) => d !== v) : [...c.days, v];
      renderTool(tool); save();
    });
    q(".presets").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      config[tool].days = b.dataset.p.split(",").map(Number); q(".repeat").open = false; renderTool(tool); save();
    });
    // The days menu closes when you pick a preset; clicks outside close it too (see below).
    document.getElementById("panels").append(node);
    els[tool] = node;
  }
}

// When this tool sends next, if it will: epoch seconds or null. The CLI works it out (a set time
// inside an open window waits for it to end), so the panel and the menu bar always agree.
function nextFor(tool) {
  const s = state?.tools?.[tool] || {};
  return s.installed && config[tool].mode !== "off" && s.next ? s.next : null;
}

function renderTool(tool) {
  const node = els[tool], q = (s) => node.querySelector(s);
  const c = config[tool], s = state?.tools?.[tool] || {};
  const now = state?.now || Date.now() / 1000;
  const open = s.reset > now;

  q(".sub").textContent = s.installed ? "Ready" : `Not found on this computer`;
  q(".sub").classList.toggle("warn", !s.installed);

  let text = "Off";
  const n = nextFor(tool);
  if (c.mode !== "off") text = !n ? "No times set" : n - now < 300 ? "Starting soon" : `Next ${when(n)}`;
  if (s.backoff > now && !open) text = `Retrying ${when(s.backoff)}`;
  q(".state-text").textContent = text;
  q(".state").classList.toggle("on", c.mode !== "off");

  dotRow(q(".five"), open ? s.five_hour : 0);
  q(".five-val").innerHTML = "";
  if (open) {
    const b = document.createElement("b"); b.textContent = s.five_hour != null ? `${Math.round(s.five_hour)}%` : "";
    q(".five-val").append(b, `${s.five_hour != null ? " used · " : ""}resets ${when(s.reset)}`);
  } else q(".five-val").append("No window open");
  dotRow(q(".week"), s.weekly);
  q(".week-val").innerHTML = "";
  if (s.weekly != null) {
    const b = document.createElement("b"); b.textContent = `${Math.round(s.weekly)}%`;
    q(".week-val").append(b, ` used${s.weekly_reset ? " · resets " + when(s.weekly_reset) : ""}`);
  } else q(".week-val").append("Shown after the first message");

  for (const b of q(".modes").children) b.setAttribute("aria-checked", String(b.dataset.v === c.mode));

  // The plan: what the day looks like in this mode.
  q(".plan").classList.toggle("hidden", c.mode === "off");
  q(".when").classList.toggle("hidden", c.mode !== "schedule");
  if (c.mode === "schedule") {
    q(".plan-q").textContent = c.times.length ? `Your day: ${c.times.length === 1 ? "one window" : c.times.length + " windows"}, ${daysText(c.days)}` : "When should your windows start?";
    drawDay(node, c.times.map((t) => ({ start: mins(t), len: WINDOW, title: clock(mins(t)), short: shortClock(mins(t)), sub: `to ${clock(mins(t) + WINDOW)}`, t })), { editable: true });
    q(".repeat-val").textContent = daysText(c.days).replace(/^on /, "");
    for (const b of q(".days").children) b.setAttribute("aria-pressed", String(c.days.includes(Number(b.dataset.v))));
  }
  if (c.mode === "watch") {
    // The next 24 hours from now: the window that's open, then one after another.
    const origin = nowMins();
    const r = new Date(s.reset * 1000);
    const far = s.reset - now >= 86400;   // e.g. waiting out the weekly cap
    const first = far ? origin + 1440 : open ? origin + wrap(r.getHours() * 60 + r.getMinutes() - origin) : origin;
    const items = [];
    if (open) items.push({ start: origin, len: first - origin, title: far ? "Waiting for the limit to reset" : "Open", short: "", sub: "", ghost: true });
    for (let m = first; m < origin + 1440; m += WINDOW) items.push({ start: m, len: WINDOW, title: clock(m), short: shortClock(m), sub: `to ${clock(m + WINDOW)}` });
    q(".plan-q").textContent = "Your next 24 hours: a new window as soon as each one ends";
    drawDay(node, items, { origin });
  }
}

// The hole turns while it runs, and hangs still (dimmer) when it's off or you'd rather nothing moved.
function renderEngine() {
  const on = !!state?.running;
  const hole = document.getElementById("hole"), moving = on && !STILL.matches;
  const src = moving ? "/assets/black-hole.gif" : "/assets/black-hole-still.webp";
  if (!hole.src.endsWith(src)) hole.src = src;
  hole.classList.toggle("still", !on);
}

function renderNight() {
  const n = config.night, w = state?.wake || {};
  document.getElementById("sleep-on").checked = n.sleep;
  document.getElementById("sleep-hours").classList.toggle("hidden", !n.sleep);
  for (const k of ["from", "to"]) { const i = document.getElementById(`night-${k}`); if (document.activeElement !== i) i.value = n[k]; }
  document.getElementById("wake-on").checked = n.wake;
  const note = document.getElementById("wake-note"), allow = document.getElementById("allow-btn");
  note.innerHTML = "";
  allow.classList.toggle("hidden", !n.wake || !!w.allowed);
  if (!n.wake) note.append("Off: a sleeping Mac skips its set times");
  else if (!w.allowed) note.append("macOS needs your OK once");
  else if (w.next) note.append("Next wake ", Object.assign(document.createElement("b"), { textContent: when(w.next + 60) }));
  else note.append("Nothing to wake for in the next 24 hours");
}

function renderLog() {
  const box = document.getElementById("log");
  const lines = (state?.log || []).filter((l) => !l.includes("rate_limit_info") && (logFilter === "all" || l.includes(logFilter))).slice(-60).reverse();
  box.innerHTML = "";
  if (!lines.length) { const e = document.createElement("p"); e.className = "empty"; e.textContent = "Nothing yet. Messages UsageForge sends show up here."; box.append(e); }
  for (const line of lines) {
    const div = document.createElement("div");
    const m = line.match(/^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d) (.*)$/);
    if (m) {
      const t = document.createElement("span"); t.className = "t"; t.textContent = m[1].slice(5, 16) + "  ";
      const rest = document.createElement("span"); rest.textContent = m[2];
      if (/failed|rate-limited|not installed|unknown/.test(m[2])) rest.className = "bad";
      else if (/^pinged/.test(m[2])) rest.className = "ok";
      div.append(t, rest);
    } else div.textContent = line;
    box.append(div);
  }
  document.getElementById("synced").textContent = `Updated ${clockTs(Date.now() / 1000)}`;
}

async function checkHealth() {
  try {
    const { problems } = await api("/api/doctor");
    const box = document.getElementById("health");
    box.innerHTML = "";
    box.classList.toggle("hidden", !problems.length);
    if (!problems.length) return;
    const title = document.createElement("b"); title.textContent = "Needs your attention";
    const list = document.createElement("ul");
    for (const p of problems) { const li = document.createElement("li"); li.textContent = p[0].toUpperCase() + p.slice(1); list.append(li); }
    box.append(title, list);
  } catch {}
}

function render() {
  for (const tool of Object.keys(TOOLS)) renderTool(tool);
  renderNight(); renderEngine(); renderLog();
}

// ---------- Guide ----------
const GUIDE = [
  { art: true, title: "Welcome to UsageForge",
    text: "Claude Code and Codex give you a <b>5-hour window</b> that starts with your first message. UsageForge sends one tiny message at the times you pick, so a fresh window is already running when you sit down." },
  { at: () => document.getElementById("hole"), title: "It keeps going without you",
    text: "While the disk up top turns, UsageForge is <b>running</b>: a check every 5 minutes, even with this page and the terminal closed. It hangs still when nothing is scheduled." },
  { at: () => els.claude.querySelector(".meters"), title: "Your usage, live",
    text: "How much of this window and this week you've used, read from Claude Code's own <b>/usage</b> and Codex's own logs. Looking costs no quota." },
  { at: () => els.claude.querySelector(".modes"), title: "Pick how windows start",
    text: "<b>At set times</b> starts one at the times you choose. <b>Back to back</b> starts the next the moment one ends. Try one now: it saves on its own." },
  { at: () => els.claude.querySelector(".day"), title: "Plan your day",
    text: "With <b>At set times</b> on, a bar shows your day. Each block is one 5-hour window. <b>Click an empty hour</b> to add one, drag a block to move it, × to remove it." },
  { at: () => document.getElementById("night"), title: "Sleep and wake",
    text: "<b>Sleep when work is done</b> lets the Mac sleep once Claude Code and Codex have finished. <b>Wake for set times</b> wakes a sleeping Mac so each window still starts." },
];
let guide = null;
const el = (tag, cls = "", html = "") => Object.assign(document.createElement(tag), { className: cls, innerHTML: html });
// The part a step points at, if it's on screen right now (the day bar is hidden while "Off").
const target = (s) => { const n = s.at?.(); return n && n.getClientRects().length ? n : null; };

function openGuide() {
  closeGuide(false);
  guide = { steps: GUIDE, dim: el("div", "guide-dim"), spot: el("div", "guide-spot"), card: el("div", "guide-card") };
  guide.card.setAttribute("role", "dialog");
  guide.card.setAttribute("aria-labelledby", "guide-title");
  document.body.append(guide.dim, guide.spot, guide.card);
  showStep(0);
}

function closeGuide(done = true) {
  if (!guide) return;
  guide.dim.remove(); guide.spot.remove(); guide.card.remove(); guide = null;
  if (done) { try { localStorage.setItem("uf-guide", "done"); } catch {} document.getElementById("guide-btn").focus(); }
}

function showStep(i) {
  const g = guide, s = g.steps[i], last = i === g.steps.length - 1;
  g.i = i;
  g.card.classList.toggle("wide", !!s.art);
  g.card.innerHTML = "";
  if (s.art) g.card.append(Object.assign(new Image(1600, 896), { className: "art", src: STILL.matches ? "/assets/black-hole-still.webp" : "/assets/black-hole.gif",
    alt: "A black hole drawn in dots: a thin ring round a dark shadow, its glowing disk crossing in front and bent up over the top" }));
  const body = el("div", "body");
  const title = el("h3", "", s.title); title.id = "guide-title";
  body.append(title, el("p", "text", s.text));
  const nav = el("div", "nav"), pips = el("span", "pips");
  for (let k = 0; k < g.steps.length; k++) pips.append(el("i", k === i ? "on" : ""));
  nav.append(pips);
  const btn = (cls, label, fn) => { const b = el("button", cls, label); b.type = "button"; b.addEventListener("click", fn); nav.append(b); return b; };
  if (!last) btn("skip", "Skip", () => closeGuide());
  if (i > 0) btn("btn ghost", "Back", () => showStep(i - 1));
  const next = btn("btn", s.art ? "Show me around" : last ? "Done" : "Next", () => (last ? closeGuide() : showStep(i + 1)));
  body.append(nav);
  g.card.append(body);
  const t = target(s);
  if (t) t.scrollIntoView({ block: "center", behavior: STILL.matches ? "auto" : "smooth" });
  placeGuide();
  next.focus({ preventScroll: true });
}

// The spotlight sits on the part being explained; the card goes below it, or above when there's no room.
function placeGuide() {
  if (!guide) return;
  const { spot, card, dim } = guide, t = target(guide.steps[guide.i]);
  const vw = innerWidth, vh = innerHeight, cw = card.offsetWidth, ch = card.offsetHeight;
  dim.classList.toggle("full", !t);
  spot.classList.toggle("hidden", !t);
  if (!t) return Object.assign(card.style, { left: `${(vw - cw) / 2}px`, top: `${Math.max(16, (vh - ch) / 2)}px` });
  const r = t.getBoundingClientRect(), pad = 8;
  Object.assign(spot.style, { left: `${r.left - pad}px`, top: `${r.top - pad}px`, width: `${r.width + 2 * pad}px`, height: `${r.height + 2 * pad}px` });
  const below = r.bottom + pad + 14, above = r.top - pad - 14 - ch;
  const top = below + ch <= vh - 16 ? below : above >= 16 ? above : Math.max(16, vh - ch - 16);
  Object.assign(card.style, { top: `${top}px`, left: `${Math.min(Math.max(16, r.left), vw - cw - 16)}px` });
}

addEventListener("scroll", placeGuide, { passive: true });
addEventListener("resize", placeGuide);
document.addEventListener("keydown", (e) => {
  if (!guide || e.target.closest?.("input, textarea")) return;
  const last = guide.i === guide.steps.length - 1;
  if (e.key === "Escape") closeGuide();
  else if (e.key === "ArrowRight") last ? closeGuide() : showStep(guide.i + 1);
  else if (e.key === "ArrowLeft" && guide.i > 0) showStep(guide.i - 1);
});
document.getElementById("guide-btn").addEventListener("click", openGuide);

// ---------- Actions ----------
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { state = await api("/api/config", config); render(); toast("Saved"); checkHealth(); }
    catch (err) { toast(err.message, true); }
    finally { saveTimer = 0; }
  }, 600);
}

let lastOk = 0, reconnect = 0;
async function refresh(first) {
  try {
    const fresh = await api("/api/status");
    state = fresh; lastOk = Date.now() / 1000; document.body.classList.remove("stale"); document.getElementById("engine").classList.add("hidden");
    if (first) {
      for (const tool of Object.keys(TOOLS)) config[tool] = { ...DEFAULT, ...(state.config?.[tool] || {}) };
      const n = state.config?.night || {};
      config.night = { sleep: (n.sleep ?? n.on) === true, wake: n.wake !== false, from: n.from || NIGHT.from, to: n.to || NIGHT.to };
    }
    render();
    let seen = false;
    try { seen = localStorage.getItem("uf-guide") === "done"; } catch {}
    if (first && !seen) openGuide();
  } catch {
    // The server went away (an upgrade, or it was stopped) or restarted with a new token. Say how old
    // the numbers are, and reload as soon as a panel answers again.
    document.getElementById("engine").classList.remove("hidden");
    document.getElementById("engine-next").textContent = lastOk ? `Numbers from ${when(lastOk)}. If this stays, run usageforge ui.` : "Run usageforge ui to open the panel.";
    document.body.classList.add("stale");
    reconnect ||= setInterval(() => fetch("/", { cache: "no-store" }).then((r) => r.ok && location.reload(), () => {}), 3000);
  }
}

document.getElementById("logfilter").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  logFilter = b.dataset.v;
  for (const x of e.currentTarget.children) x.setAttribute("aria-pressed", String(x === b));
  renderLog();
});

document.getElementById("sleep-on").addEventListener("change", (e) => { config.night.sleep = e.target.checked; renderNight(); save(); });
document.getElementById("wake-on").addEventListener("change", (e) => { config.night.wake = e.target.checked; renderNight(); save(); });
for (const k of ["from", "to"]) {
  document.getElementById(`night-${k}`).addEventListener("change", (e) => {
    if (!/^\d\d:\d\d$/.test(e.target.value)) return;
    config.night[k] = e.target.value; save();
  });
}
document.getElementById("allow-btn").addEventListener("click", async (e) => {
  const b = e.currentTarget;
  b.disabled = true; b.textContent = "Waiting for your password…";
  try { state = await api("/api/wake-allow", {}); render(); toast("Allowed. The Mac wakes for your set times"); }
  catch (err) { toast(err.message, true); }
  finally { b.disabled = false; b.textContent = "Allow"; renderNight(); }
});
// An open days menu closes on a click anywhere else, or on Escape.
document.addEventListener("click", (e) => { for (const d of document.querySelectorAll("details.repeat[open]")) if (!d.contains(e.target)) d.open = false; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") for (const d of document.querySelectorAll("details.repeat[open]")) d.open = false; });

build();
render();
refresh(true);
checkHealth();
// Pick up new activity and the moving "now" line, without touching unsaved edits.
setInterval(() => { if (!saveTimer) refresh(false); }, 30000);
</script>
</body>
</html>
