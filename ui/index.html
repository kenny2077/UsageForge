<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="uf-token" content="__UF_TOKEN__">
<meta name="color-scheme" content="dark">
<title>UsageForge</title>
<link rel="icon" href="/assets/usageforge-mark.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Archivo"; src: url("/assets/fonts/archivo-var-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("/assets/fonts/instrument-sans-var-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }

:root {
  --deep: #02060e; --night: #050c1a; --night-2: #0a1426; --night-3: #111e36;
  --ink: #eaf2f8; --ink-2: #c8d6e4; --muted: #93a7bb; --faint: #62778d;
  --line: rgba(150, 205, 245, 0.14); --line-2: rgba(150, 205, 245, 0.28);
  --aurora: #4fe3d0; --aurora-hi: #8cf2e6; --amber: #ffb547; --rose: #ff6f7d;
  --display: "Archivo", "Arial Narrow", Impact, sans-serif;
  --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --chamfer: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  --chamfer-lg: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  --gutter: max(clamp(16px, 4vw, 48px), calc((100% - 1320px) / 2));
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--deep); color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(60% 40% at 78% 0%, rgba(76, 201, 240, 0.16), transparent 70%),
    radial-gradient(45% 35% at 22% 0%, rgba(79, 227, 208, 0.12), transparent 70%),
    var(--night);
  background-attachment: fixed;
}
h1, h2, h3 { margin: 0; font-family: var(--display); font-stretch: 72%; font-weight: 800; line-height: 0.94; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
::selection { background: var(--aurora); color: var(--night); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

/* ---------- Header: brand in the middle ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; height: 72px; padding: 0 var(--gutter);
  background: rgba(5, 12, 26, 0.84); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}
.top .left { justify-self: start; }
.top .right { justify-self: end; display: flex; align-items: center; gap: 16px; }
.brand { display: grid; justify-items: center; gap: 5px; color: var(--ink); text-decoration: none; }
.brand .row { display: flex; align-items: center; gap: 10px; font: 700 19px/1 var(--display); font-stretch: 85%; }
.brand img { width: 44px; height: 24px; image-rendering: pixelated; }
.engine { display: inline-flex; align-items: center; gap: 10px; padding: 8px 12px; font: 500 12.5px/1 var(--mono); letter-spacing: 0.04em; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); clip-path: var(--chamfer); }
.dot { width: 8px; height: 8px; flex: none; background: var(--faint); }
.engine.on .dot, .state.on .dot { background: var(--amber); box-shadow: 0 0 12px rgba(255, 181, 71, 0.7); animation: pulse 2.4s steps(2) infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }
a.link { color: var(--muted); font-size: 14px; text-decoration: none; }
a.link:hover { color: var(--ink); }

/* ---------- Tool panels ---------- */
main { padding: 28px var(--gutter) 64px; }
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.tool {
  --tint: #d97757;
  position: relative;
  background: linear-gradient(160deg, var(--night-3), var(--night-2) 55%);
  box-shadow: inset 0 0 0 1px var(--line); clip-path: var(--chamfer-lg);
}
.tool[data-tool="codex"] { --tint: #7a7cff; }
.tool::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; opacity: 0.85; background: linear-gradient(90deg, transparent, var(--tint) 30%, var(--aurora) 70%, transparent); }
.sec { padding: 22px 24px; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
.q { margin-bottom: 14px; font: 700 19px/1.2 var(--display); font-stretch: 82%; color: var(--ink); }
.q small { display: block; margin-top: 4px; font: 400 13.5px/1.4 var(--sans); color: var(--muted); }

.head { display: flex; align-items: center; gap: 14px; padding-top: 26px; }
.icon { width: 48px; height: 48px; flex: none; border-radius: 11px; box-shadow: 0 10px 24px -12px #000; }
.tile { display: grid; place-items: center; width: 48px; height: 48px; flex: none; border-radius: 11px; font: 800 17px/1 var(--display); color: var(--night); background: var(--tint); }
.head h2 { font-size: 34px; }
.head .sub { margin-top: 5px; color: var(--muted); font-size: 13.5px; }
.head .sub.warn { color: var(--amber); }
.state { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; padding: 8px 12px; color: var(--ink-2); font: 500 12.5px/1.2 var(--mono); box-shadow: inset 0 0 0 1px var(--line); clip-path: var(--chamfer); white-space: nowrap; }

/* Meters */
.meters { display: grid; gap: 12px; }
.meter { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; align-items: center; gap: 14px; }
.meter .name { color: var(--ink-2); font-size: 14px; }
.meter .val { color: var(--muted); font: 500 12.5px/1.3 var(--mono); white-space: nowrap; text-align: right; min-width: 150px; }
.meter .val b { color: var(--ink); font-weight: 600; }
.lamps { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.lamps i { height: 10px; background: rgba(150, 205, 245, 0.08); }
.lamps i.on { background: var(--aurora); }
.lamps.high i.on { background: var(--amber); }
.lamps.full i.on { background: var(--rose); }

/* Mode as three choice cards */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mode {
  display: grid; align-content: start; gap: 6px; padding: 14px; text-align: left; cursor: pointer; border: 0;
  background: rgba(234, 242, 248, 0.04); box-shadow: inset 0 0 0 1px var(--line); clip-path: var(--chamfer);
  transition: background 0.2s, box-shadow 0.2s;
}
.mode:hover { background: rgba(234, 242, 248, 0.07); }
.mode .glyph { display: grid; grid-template-columns: repeat(6, 6px); gap: 2px; height: 14px; margin-bottom: 4px; }
.mode .glyph i { background: rgba(150, 205, 245, 0.16); }
.mode .glyph i.a { background: var(--amber); } .mode .glyph i.t { background: var(--aurora); }
.mode b { font: 700 16px/1.15 var(--display); font-stretch: 85%; }
.mode span { color: var(--muted); font-size: 13px; line-height: 1.4; }
.mode[aria-checked="true"] { background: rgba(79, 227, 208, 0.1); box-shadow: inset 0 0 0 2px var(--aurora); }
.mode:focus-visible { clip-path: none; }

/* The day, drawn: one bar for 24 hours. Windows are blocks you can add, drag and remove. */
.day { position: relative; margin-top: 8px; user-select: none; -webkit-user-select: none; }
.zones { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 6px; color: var(--faint); font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.zones span { padding-left: 6px; border-left: 1px solid var(--line); }
.bar {
  position: relative; height: 78px; cursor: pointer;
  background:
    linear-gradient(90deg, rgba(2, 6, 14, 0.55) 0 25%, transparent 25% 87.5%, rgba(2, 6, 14, 0.35) 87.5%),
    repeating-linear-gradient(90deg, rgba(150, 205, 245, 0.05) 0 calc(100% / 24 - 1px), rgba(150, 205, 245, 0.12) 0 calc(100% / 24));
  box-shadow: inset 0 0 0 1px var(--line-2);
}
.bar.ro, .bar.ro .band { cursor: default; }
.bar.watch { background: repeating-linear-gradient(90deg, rgba(150, 205, 245, 0.05) 0 calc(100% / 24 - 1px), rgba(150, 205, 245, 0.12) 0 calc(100% / 24)); }
.bar:not(.ro):hover { box-shadow: inset 0 0 0 1px var(--aurora); }
.ghosthour { position: absolute; top: 0; bottom: 0; width: calc(100% / 24); background: rgba(79, 227, 208, 0.12); pointer-events: none; opacity: 0; transition: opacity 0.15s; }
.bar:not(.ro):hover .ghosthour { opacity: 1; }
.band {
  position: absolute; top: 10px; bottom: 10px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
  padding: 0 26px 0 12px; overflow: hidden; white-space: nowrap; cursor: grab; touch-action: none;
  color: var(--night); background: linear-gradient(90deg, var(--aurora), color-mix(in srgb, var(--aurora) 72%, transparent));
  box-shadow: inset 3px 0 0 var(--amber);
}
.band b { font: 700 14px/1 var(--mono); }
.band span { font: 500 11.5px/1 var(--mono); opacity: 0.75; }
.band.dragging { cursor: grabbing; opacity: 0.85; outline: 2px solid var(--amber); }
.band.bad { background: rgba(255, 111, 125, 0.5); }
.band.ghost { background: rgba(79, 227, 208, 0.16); color: var(--aurora-hi); box-shadow: none; cursor: default; }
.band .x { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border: 0; padding: 0; cursor: pointer; font: 600 13px/18px var(--sans); color: var(--night); background: rgba(5, 12, 26, 0.18); }
.band .x:hover { background: rgba(5, 12, 26, 0.4); }
.nowline { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--amber); pointer-events: none; }
.nowline span { position: absolute; bottom: 4px; left: 5px; padding: 2px 5px; font: 600 10px/1 var(--mono); letter-spacing: 0.08em; color: var(--night); background: var(--amber); text-transform: uppercase; }
.empty-bar { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: 14px; pointer-events: none; }
.ticks { position: relative; height: 14px; margin-top: 8px; color: var(--faint); font: 500 11px/1 var(--mono); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; } .ticks span:last-child { transform: translateX(-100%); }
.tip { margin-top: 12px; color: var(--muted); font-size: 13.5px; }
.tip b { color: var(--ink); font-weight: 600; }
.exact { border: 0; padding: 0; background: none; cursor: pointer; color: var(--aurora); font-size: 13.5px; }
.exact:hover { color: var(--aurora-hi); }
.adder { display: inline-flex; gap: 8px; vertical-align: middle; }
input[type="time"], input[type="text"], textarea { padding: 9px 11px; background: var(--night); border: 0; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); clip-path: var(--chamfer); }
input[type="time"] { font-family: var(--mono); color-scheme: dark; }
textarea { width: 100%; min-height: 64px; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--faint); }

.repeat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 18px; }
.repeat > span { color: var(--ink-2); font-size: 14px; }
.extra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
.days { display: flex; gap: 5px; }
.days button, .presets button { border: 0; cursor: pointer; font: 600 12px/1 var(--mono); clip-path: var(--chamfer); transition: background 0.2s, color 0.2s; }
.days button { width: 38px; padding: 9px 0; color: var(--muted); background: rgba(150, 205, 245, 0.07); }
.days button[aria-pressed="true"] { color: var(--night); background: var(--aurora); }
.presets { display: flex; gap: 5px; }
.presets button { padding: 9px 10px; color: var(--muted); background: none; box-shadow: inset 0 0 0 1px var(--line); }
.presets button:hover { color: var(--ink); }


/* Advanced */
details.adv summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; color: var(--ink-2); font-size: 14px; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary::after { content: "+"; color: var(--aurora); font: 400 18px/1 var(--mono); }
details.adv[open] summary::after { content: "−"; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 12px; margin-top: 14px; }
.two input { width: 100%; font-family: var(--mono); font-size: 13.5px; }
.field-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }

/* Try it now */
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 280px; min-height: 48px; overflow-y: auto; padding: 2px; }
.msg { max-width: 86%; padding: 10px 13px; white-space: pre-wrap; overflow-wrap: anywhere; clip-path: var(--chamfer); }
.msg.me { align-self: flex-end; color: var(--night); background: var(--aurora); }
.msg.ai { align-self: flex-start; background: rgba(234, 242, 248, 0.06); box-shadow: inset 0 0 0 1px var(--line); }
.msg.err { align-self: flex-start; background: rgba(255, 111, 125, 0.12); box-shadow: inset 0 0 0 1px rgba(255, 111, 125, 0.5); }
.msg small { display: block; margin-top: 6px; color: var(--faint); font: 500 11px/1.3 var(--mono); }
.msg.me small { color: rgba(5, 12, 26, 0.6); }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; background: var(--muted); animation: blink 1s steps(2) infinite; }
.typing i:nth-child(2) { animation-delay: 0.2s; } .typing i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 50% { opacity: 0.2; } }
.composer { display: flex; gap: 8px; margin-top: 10px; }
.composer input { flex: 1; min-width: 0; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 9px 16px; border: 0; cursor: pointer; font: 600 14px/1 var(--sans); color: var(--night); background: var(--aurora); clip-path: var(--chamfer); transition: background 0.2s, transform 0.15s var(--ease); white-space: nowrap; }
.btn:hover { background: var(--aurora-hi); }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:disabled { cursor: not-allowed; opacity: 0.45; }
.btn.ghost { color: var(--ink); background: rgba(234, 242, 248, 0.06); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.ghost:hover { background: rgba(234, 242, 248, 0.11); }
.btn:focus-visible, .days button:focus-visible, .presets button:focus-visible { clip-path: none; }

/* Activity */
.activity { margin-top: 20px; background: var(--night-2); box-shadow: inset 0 0 0 1px var(--line); clip-path: var(--chamfer-lg); }
.activity .bar2 { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
.activity h3 { font-size: 26px; }
.activity .synced { margin-left: auto; color: var(--faint); font: 500 12px/1 var(--mono); }
.filter { display: flex; gap: 4px; }
.filter button { padding: 8px 12px; border: 0; cursor: pointer; font: 600 12px/1 var(--mono); letter-spacing: 0.06em; color: var(--muted); background: none; clip-path: var(--chamfer); }
.filter button[aria-pressed="true"] { color: var(--night); background: var(--aurora); }
.loglines { padding: 14px 24px 20px; max-height: 300px; overflow: auto; font: 12.5px/1.75 var(--mono); color: var(--ink-2); }
.loglines div { white-space: pre-wrap; overflow-wrap: anywhere; }
.loglines .t { color: var(--faint); }
.loglines .bad { color: var(--rose); }
.loglines .ok { color: var(--aurora); }
.empty { color: var(--faint); font-size: 13.5px; text-align: center; padding: 18px 0; }

.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: grid; gap: 8px; }
.toast { padding: 11px 14px; font: 500 13px/1.3 var(--mono); color: var(--ink); background: var(--night-3); box-shadow: inset 0 0 0 1px var(--line-2), 0 20px 40px -20px #000; clip-path: var(--chamfer); animation: rise 0.35s var(--ease); }
.toast.bad { box-shadow: inset 0 0 0 1px rgba(255, 111, 125, 0.6); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

.hidden { display: none !important; }

@media (max-width: 1080px) { .panels { grid-template-columns: 1fr; } }
@media (max-width: 600px) {
  .top { grid-template-columns: auto 1fr; } .top .left { display: none; } .brand { justify-items: start; }
  .sec { padding: 18px 16px; }
  .modes { grid-template-columns: 1fr; }
  .meter { grid-template-columns: 1fr auto; } .meter .lamps { grid-column: 1 / -1; grid-row: 2; }
  .two { grid-template-columns: 1fr; }
  .band { padding: 0 22px 0 6px; } .band span { display: none; } .band b { font-size: 12px; }
  .ticks span:nth-child(even) { display: none; }
  .activity .bar2 { flex-wrap: wrap; } .activity .synced { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="left"><a class="link" href="https://github.com/kenny2077/UsageForge#readme" target="_blank" rel="noopener noreferrer">Help ↗</a></span>
  <a class="brand" href="/">
    <span class="row"><img src="/assets/usageforge-mark.svg" width="44" height="24" alt="">UsageForge</span>
  </a>
  <span class="right"><span class="engine" id="engine" role="status"><span class="dot"></span><span>Connecting…</span></span></span>
</header>

<main>
  <div class="panels" id="panels"></div>

  <section class="activity" aria-labelledby="act-title">
    <div class="bar2">
      <h3 id="act-title">Activity</h3>
      <div class="filter" id="logfilter" role="group" aria-label="Filter activity">
        <button type="button" data-v="all" aria-pressed="true">All</button>
        <button type="button" data-v="claude" aria-pressed="false">Claude</button>
        <button type="button" data-v="codex" aria-pressed="false">Codex</button>
      </div>
      <span class="synced" id="synced"></span>
    </div>
    <div class="loglines" id="log"></div>
  </section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<template id="tool-tpl">
  <article class="tool">
    <div class="sec head">
      <span class="tile"></span>
      <div><h2 class="name"></h2><p class="sub"></p></div>
      <span class="state"><span class="dot"></span><span class="state-text"></span></span>
    </div>

    <div class="sec">
      <div class="meters">
        <div class="meter"><span class="name">This 5-hour window</span><div class="lamps five"></div><span class="val five-val"></span></div>
        <div class="meter"><span class="name">This week</span><div class="lamps week"></div><span class="val week-val"></span></div>
      </div>
    </div>

    <div class="sec">
      <p class="q">How should it start your windows?</p>
      <div class="modes" role="radiogroup">
        <button type="button" class="mode" role="radio" data-v="off"><span class="glyph"><i></i><i></i><i></i><i></i><i></i><i></i></span><b>Off</b><span>Don't send anything.</span></button>
        <button type="button" class="mode" role="radio" data-v="schedule"><span class="glyph"><i class="a"></i><i class="t"></i><i class="t"></i><i></i><i class="a"></i><i class="t"></i></span><b>At set times</b><span>Start a window at the times you pick.</span></button>
        <button type="button" class="mode" role="radio" data-v="watch"><span class="glyph"><i class="a"></i><i class="t"></i><i class="a"></i><i class="t"></i><i class="a"></i><i class="t"></i></span><b>Back to back</b><span>Start a new window the moment one ends.</span></button>
      </div>
    </div>

    <div class="sec plan">
      <p class="q plan-q"></p>
      <div class="day">
        <div class="zones"><span>Night</span><span>Morning</span><span>Afternoon</span><span>Evening</span></div>
        <div class="bar"></div>
        <div class="ticks"></div>
      </div>
      <p class="tip"></p>

      <div class="when">
        <div class="repeat">
          <span>Repeat on</span>
          <div class="days" role="group" aria-label="Days"></div>
          <div class="presets">
            <button type="button" data-p="0,1,2,3,4,5,6">Every day</button>
            <button type="button" data-p="1,2,3,4,5">Weekdays</button>
            <button type="button" data-p="0,6">Weekends</button>
          </div>
        </div>
        <div class="extra">
          <button type="button" class="exact">+ Add an exact time</button>
          <span class="adder hidden">
            <input type="time" class="new-time" value="06:00" aria-label="Time to add">
            <button type="button" class="btn ghost add-time">Add</button>
          </span>
        </div>
      </div>
    </div>

    <div class="sec">
      <p class="q">Try it now<small>Sends one message right away. That starts a window if none is open.</small></p>
      <div class="chat" aria-live="polite"></div>
      <form class="composer">
        <input type="text" class="say" maxlength="500" placeholder="Say something, or leave empty for a greeting" aria-label="Message to send now">
        <button type="submit" class="btn send">Send</button>
      </form>
    </div>

    <div class="sec">
      <details class="adv">
        <summary>Message and model</summary>
        <div class="two">
          <div><label class="field-label">Message sent each time</label><textarea class="prompt" maxlength="500" placeholder="Automatic: Good morning, Good afternoon or Good evening"></textarea></div>
          <div><label class="field-label">Model</label><input type="text" class="model" maxlength="64" spellcheck="false" autocomplete="off"></div>
        </div>
      </details>
    </div>
  </article>
</template>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name="uf-token"]').content;
const TOOLS = {
  claude: { name: "Claude Code", tile: "CC", placeholder: "haiku (default)" },
  codex: { name: "Codex", tile: "CX", placeholder: "Codex default" },
};
const DAYS = [[1, "M"], [2, "T"], [3, "W"], [4, "T"], [5, "F"], [6, "S"], [0, "S"]];
const DAY_NAMES = ["Sundays", "Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays"];
const DEFAULT = { mode: "off", times: ["06:00"], days: [0, 1, 2, 3, 4, 5, 6], prompt: "", model: "" };
const WINDOW = 5 * 60; // minutes

let state = null;
let config = { claude: { ...DEFAULT }, codex: { ...DEFAULT } };
let saveTimer = 0;
let logFilter = "all";
const els = {};
const chats = { claude: [], codex: [] };
try { Object.assign(chats, JSON.parse(localStorage.getItem("uf-chats") || "{}")); } catch {}

// ---------- API ----------
async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-UF-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function toast(text, bad = false) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = text;
  document.getElementById("toasts").append(t);
  setTimeout(() => t.remove(), 2600);
}

// ---------- Time helpers (shown in the viewer's own 12h/24h format) ----------
const pad = (n) => String(n).padStart(2, "0");
const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = (m) => `${pad(Math.floor(((m % 1440) + 1440) % 1440 / 60))}:${pad(((m % 60) + 60) % 60)}`;
const clock = (m) => new Date(2000, 0, 1, 0, ((m % 1440) + 1440) % 1440).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const clockTs = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const when = (ts) => {
  const d = new Date(ts * 1000);
  return d.toDateString() === new Date().toDateString() ? clockTs(ts) : `${d.toLocaleDateString([], { weekday: "short" })} ${clockTs(ts)}`;
};
const nowMins = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

function lampRow(el, pct) {
  const on = pct == null ? 0 : Math.round(Math.min(100, Math.max(0, pct)) / 5);
  el.innerHTML = "";
  for (let i = 0; i < 20; i++) { const c = document.createElement("i"); if (i < on) c.className = "on"; el.append(c); }
  el.classList.toggle("high", pct >= 75 && pct < 100);
  el.classList.toggle("full", pct >= 100);
}

function nextScheduled(c) {
  if (!c.times.length || !c.days.length) return null;
  const now = new Date();
  for (let add = 0; add < 8; add++) {
    const d = new Date(now); d.setDate(now.getDate() + add);
    if (!c.days.includes(d.getDay())) continue;
    for (const t of [...c.times].sort((a, b) => mins(a) - mins(b))) {
      const at = new Date(d); at.setHours(...t.split(":").map(Number), 0, 0);
      if (at > now) return at.getTime() / 1000;
    }
  }
  return null;
}

function daysText(days) {
  const s = [...days].sort().join(",");
  if (s === "0,1,2,3,4,5,6") return "every day";
  if (s === "1,2,3,4,5") return "on weekdays";
  if (s === "0,6") return "on weekends";
  return "on " + days.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map((d) => DAY_NAMES[d]).join(", ");
}

// ---------- The 24-hour bar ----------
const wrap = (m) => ((m % 1440) + 1440) % 1440;
// The time in `times` (other than `skip`) whose window overlaps one starting at minute m, if any.
function clash(times, m, skip) {
  return times.find((t) => t !== skip && (wrap(m - mins(t)) < WINDOW || wrap(mins(t) - m) < WINDOW));
}

// items: [{start, len, title, sub, ghost, t}]. origin: minute of day at the left edge
// (midnight for set times, "now" for back to back).
function drawDay(node, items, { origin = 0, editable = false } = {}) {
  const bar = node.querySelector(".bar");
  bar.innerHTML = "";
  bar.classList.toggle("ro", !editable);
  bar.classList.toggle("watch", origin !== 0);
  node.querySelector(".zones").classList.toggle("hidden", origin !== 0);
  const left = (m) => `${(wrap(m - origin) / 1440) * 100}%`;
  for (const it of items) {
    const start = wrap(it.start - origin);
    // A window that runs past the right edge continues at the left (midnight) or is cut (next 24 hours).
    const pieces = start + it.len > 1440 ? (origin ? [[start, 1440]] : [[start, 1440], [0, start + it.len - 1440]]) : [[start, start + it.len]];
    for (const [a, b] of pieces) {
      const band = document.createElement("div");
      band.className = "band" + (it.ghost ? " ghost" : "");
      band.style.left = `${(a / 1440) * 100}%`; band.style.width = `${((b - a) / 1440) * 100}%`;
      if (it.t) band.dataset.t = it.t;
      if (a === start) {
        const t = document.createElement("b"); t.textContent = it.title;
        const sub = document.createElement("span"); sub.textContent = it.sub || "";
        band.append(t, sub);
        if (editable) {
          const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "×";
          x.setAttribute("aria-label", `Remove ${it.title}`); band.append(x);
          band.title = "Drag to move";
        }
      }
      bar.append(band);
    }
  }
  if (!items.length && editable) {
    const e = document.createElement("div"); e.className = "empty-bar"; e.textContent = "Click the hour you want your first window to start"; bar.append(e);
  }
  if (!origin) {
    const now = document.createElement("div"); now.className = "nowline"; now.style.left = left(nowMins());
    const tag = document.createElement("span"); tag.textContent = "now"; now.append(tag); bar.append(now);
  }
  if (editable) { const g = document.createElement("div"); g.className = "ghosthour"; bar.append(g); }
  const ticks = node.querySelector(".ticks");
  ticks.innerHTML = "";
  for (let k = 0; k <= 1440; k += 180) {
    const span = document.createElement("span");
    span.style.left = `${(k / 1440) * 100}%`;
    span.textContent = origin && k === 0 ? "Now" : clock(origin + k).replace(":00", "");
    ticks.append(span);
  }
}

// ---------- Rendering ----------
function build() {
  const tpl = document.getElementById("tool-tpl");
  for (const tool of Object.keys(TOOLS)) {
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.dataset.tool = tool;
    const q = (s) => node.querySelector(s);

    // The tool's own app icon when available, letters otherwise.
    const img = new Image(); img.className = "icon"; img.alt = ""; img.src = `/icons/${tool}.png`;
    img.onload = () => q(".tile").replaceWith(img);
    q(".tile").textContent = TOOLS[tool].tile;
    q(".name").textContent = TOOLS[tool].name;
    q(".modes").setAttribute("aria-label", `${TOOLS[tool].name}: how to start windows`);
    q(".model").placeholder = TOOLS[tool].placeholder;
    for (const [v, label] of DAYS) {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.v = v; b.textContent = label;
      b.setAttribute("aria-label", DAY_NAMES[v].slice(0, -1));
      q(".days").append(b);
    }

    q(".modes").addEventListener("click", (e) => {
      const b = e.target.closest(".mode"); if (!b) return;
      config[tool].mode = b.dataset.v; renderTool(tool); save();
    });
    const addTime = (t) => {
      const c = config[tool];
      if (c.times.includes(t)) return toast(`${clock(mins(t))} is already set`);
      const hit = clash(c.times, mins(t));
      if (hit) return toast(`${clock(mins(t))} is inside your ${clock(mins(hit))} window. Try ${clock(mins(hit) + WINDOW)} or later.`, true);
      if (c.times.length >= 12) return toast("Up to 12 times", true);
      c.times = [...c.times, t].sort((a, b) => mins(a) - mins(b));
      renderTool(tool); save();
    };
    q(".exact").addEventListener("click", () => { q(".adder").classList.toggle("hidden"); q(".new-time").focus(); });
    q(".add-time").addEventListener("click", () => {
      const t = q(".new-time").value;
      if (!/^\d\d:\d\d$/.test(t)) return toast("Pick a time first", true);
      addTime(t);
    });

    // The bar is the editor: click an empty hour to add, drag a window to move it, × to remove.
    const bar = q(".bar");
    const hourAt = (x) => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(23, Math.floor(((x - r.left) / r.width) * 24))); };
    let drag = null;
    bar.addEventListener("pointermove", (e) => {
      const g = bar.querySelector(".ghosthour");
      if (g && !drag) g.style.left = `${(hourAt(e.clientX) / 24) * 100}%`;
      if (!drag) return;
      const r = bar.getBoundingClientRect();
      const delta = Math.round((((e.clientX - drag.x) / r.width) * 1440) / 15) * 15;
      drag.to = wrap(mins(drag.t) + delta);
      drag.moved = drag.moved || Math.abs(e.clientX - drag.x) > 4;
      const bad = !!clash(config[tool].times, drag.to, drag.t);
      for (const b of drag.bands) {
        b.classList.add("dragging"); b.classList.toggle("bad", bad);
        b.style.transform = `translateX(${(delta / 1440) * r.width}px)`;
      }
      const label = drag.bands[0].querySelector("b"); if (label) label.textContent = clock(drag.to);
    });
    bar.addEventListener("pointerdown", (e) => {
      const band = e.target.closest(".band[data-t]");
      if (!band || e.target.closest(".x") || config[tool].mode !== "schedule") return;
      drag = { t: band.dataset.t, x: e.clientX, to: mins(band.dataset.t), moved: false, bands: [...bar.querySelectorAll(`.band[data-t="${band.dataset.t}"]`)] };
      bar.setPointerCapture(e.pointerId);
    });
    const endDrag = () => {
      if (!drag) return;
      const d = drag; drag = null;
      if (!d.moved) return renderTool(tool);
      const c = config[tool];
      const hit = clash(c.times, d.to, d.t);
      const to = hhmm(d.to);
      if (hit) { toast(`That overlaps your ${clock(mins(hit))} window`, true); return renderTool(tool); }
      if (to === d.t) return renderTool(tool);
      c.times = c.times.map((t) => (t === d.t ? to : t)).sort((a, b) => mins(a) - mins(b));
      bar.dataset.justDragged = "1";
      renderTool(tool); save();
    };
    bar.addEventListener("pointerup", endDrag);
    bar.addEventListener("pointercancel", endDrag);
    bar.addEventListener("click", (e) => {
      if (bar.dataset.justDragged) { delete bar.dataset.justDragged; return; }
      if (config[tool].mode !== "schedule") return;
      const x = e.target.closest(".x");
      if (x) {
        const t = x.closest(".band").dataset.t;
        config[tool].times = config[tool].times.filter((v) => v !== t);
        return renderTool(tool), save();
      }
      if (e.target.closest(".band")) return;
      addTime(`${pad(hourAt(e.clientX))}:00`);
    });
    q(".days").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const v = Number(b.dataset.v), c = config[tool];
      if (c.days.includes(v) && c.days.length === 1) return toast("Keep at least one day", true);
      c.days = c.days.includes(v) ? c.days.filter((d) => d !== v) : [...c.days, v];
      renderTool(tool); save();
    });
    q(".presets").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      config[tool].days = b.dataset.p.split(",").map(Number); renderTool(tool); save();
    });
    q(".prompt").addEventListener("input", (e) => { config[tool].prompt = e.target.value; save(); });
    q(".model").addEventListener("input", (e) => { config[tool].model = e.target.value.trim(); save(); });
    q(".composer").addEventListener("submit", (e) => { e.preventDefault(); send(tool); });

    document.getElementById("panels").append(node);
    els[tool] = node;
  }
}

function renderTool(tool) {
  const node = els[tool], q = (s) => node.querySelector(s);
  const c = config[tool], s = state?.tools?.[tool] || {};
  const now = state?.now || Date.now() / 1000;
  const open = s.reset > now;

  q(".sub").textContent = s.installed ? "Ready" : `Not found on this computer`;
  q(".sub").classList.toggle("warn", !s.installed);
  q(".send").disabled = !s.installed;

  let text = "Off";
  if (c.mode === "schedule") { const n = nextScheduled(c); text = n ? `Next: ${when(n)}` : "No times set"; }
  if (c.mode === "watch") text = open ? `Next: ${when(s.reset)}` : "Starting soon";
  if (s.backoff > now) text = `Retrying ${when(s.backoff)}`;
  q(".state-text").textContent = text;
  q(".state").classList.toggle("on", c.mode !== "off");

  lampRow(q(".five"), open ? s.five_hour : 0);
  q(".five-val").innerHTML = "";
  q(".five-val").append(open
    ? Object.assign(document.createElement("span"), { textContent: `${s.five_hour != null ? Math.round(s.five_hour) + "% used · " : ""}resets ${when(s.reset)}` })
    : "No window open");
  lampRow(q(".week"), s.weekly);
  q(".week-val").textContent = s.weekly != null ? `${Math.round(s.weekly)}% used${s.weekly_reset ? " · resets " + when(s.weekly_reset) : ""}` : "Shown after the first message";

  for (const b of q(".modes").children) b.setAttribute("aria-checked", String(b.dataset.v === c.mode));

  // The plan: what the day looks like in this mode.
  q(".plan").classList.toggle("hidden", c.mode === "off");
  q(".when").classList.toggle("hidden", c.mode !== "schedule");
  const next = c.mode === "schedule" ? nextScheduled(c) : null;
  const tip = q(".tip"); tip.innerHTML = "";
  if (c.mode === "schedule") {
    q(".plan-q").textContent = c.times.length ? `Your day: ${c.times.length === 1 ? "one window" : c.times.length + " windows"}, ${daysText(c.days)}` : "When should your windows start?";
    drawDay(node, c.times.map((t) => ({ start: mins(t), len: WINDOW, title: clock(mins(t)), sub: `to ${clock(mins(t) + WINDOW)}`, t })), { editable: true });
    tip.append(c.times.length
      ? "Click an empty hour to add a window. Drag one to move it, × to remove it."
      : "Each message starts a 5-hour window. Click the timeline to add one.");
    if (next) tip.append(" Next: ", Object.assign(document.createElement("b"), { textContent: when(next) }), ".");
    for (const b of q(".days").children) b.setAttribute("aria-pressed", String(c.days.includes(Number(b.dataset.v))));
  }
  if (c.mode === "watch") {
    // The next 24 hours from now: the window that's open, then one after another.
    const origin = nowMins();
    const r = new Date(s.reset * 1000);
    const first = open ? origin + wrap(r.getHours() * 60 + r.getMinutes() - origin) : origin;
    const items = [];
    if (open) items.push({ start: origin, len: first - origin, title: "Open now", sub: "", ghost: true });
    for (let m = first; m < origin + 1440; m += WINDOW) items.push({ start: m, len: WINDOW, title: clock(m), sub: `to ${clock(m + WINDOW)}` });
    q(".plan-q").textContent = "Your next 24 hours: a new window as soon as each one ends";
    drawDay(node, items, { origin });
    tip.append("UsageForge checks every 5 minutes, all week. Next: ",
      Object.assign(document.createElement("b"), { textContent: open ? when(s.reset) : "within 5 minutes" }), ".");
  }

  if (document.activeElement !== q(".prompt")) q(".prompt").value = c.prompt || "";
  if (document.activeElement !== q(".model")) q(".model").value = c.model || "";
  renderChat(tool);
}

function renderChat(tool) {
  const box = els[tool].querySelector(".chat");
  box.innerHTML = "";
  for (const m of chats[tool]) {
    const div = document.createElement("div");
    div.className = `msg ${m.from}`;
    if (m.typing) div.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    else div.textContent = m.text;
    if (m.meta) { const s = document.createElement("small"); s.textContent = m.meta; div.append(s); }
    box.append(div);
  }
  box.classList.toggle("hidden", !chats[tool].length);
  box.scrollTop = box.scrollHeight;
}

function renderEngine() {
  const e = document.getElementById("engine");
  e.classList.toggle("on", !!state?.running);
  e.lastElementChild.textContent = state?.running ? "Running" : "Paused";
  e.title = state?.running ? "UsageForge checks every 5 minutes in the background" : "Nothing is scheduled";
}

function renderLog() {
  const box = document.getElementById("log");
  const lines = (state?.log || []).filter((l) => !l.includes("rate_limit_info") && (logFilter === "all" || l.includes(logFilter))).slice(-60).reverse();
  box.innerHTML = "";
  if (!lines.length) { const e = document.createElement("p"); e.className = "empty"; e.textContent = "Nothing yet. Pick a mode or try a message."; box.append(e); return; }
  for (const line of lines) {
    const div = document.createElement("div");
    const m = line.match(/^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d) (.*)$/);
    if (m) {
      const t = document.createElement("span"); t.className = "t"; t.textContent = m[1].slice(5, 16) + "  ";
      const rest = document.createElement("span"); rest.textContent = m[2];
      if (/failed|rate-limited|not installed|unknown/.test(m[2])) rest.className = "bad";
      else if (/^pinged/.test(m[2])) rest.className = "ok";
      div.append(t, rest);
    } else div.textContent = line;
    box.append(div);
  }
  document.getElementById("synced").textContent = `Updated ${clockTs(Date.now() / 1000)}`;
}

function render() {
  for (const tool of Object.keys(TOOLS)) renderTool(tool);
  renderEngine(); renderLog();
}

// ---------- Actions ----------
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { state = await api("/api/config", config); saveTimer = 0; render(); toast("Saved"); }
    catch (err) { toast(err.message, true); }
  }, 600);
}

async function send(tool) {
  const input = els[tool].querySelector(".say");
  const button = els[tool].querySelector(".send");
  if (button.disabled) return;
  const typed = input.value.trim();
  chats[tool].push({ from: "me", text: typed || config[tool].prompt || "(greeting)", meta: clockTs(Date.now() / 1000) });
  chats[tool].push({ from: "ai", typing: true });
  input.value = ""; button.disabled = true; renderChat(tool);
  try {
    const r = await api("/api/ping", { tool, prompt: typed });
    state = r.status;
    chats[tool].pop();
    const s = state.tools[tool];
    if (r.ok) chats[tool].push({ from: "ai", text: s.reply || "(no reply text)", meta: s.reset ? `Window resets ${when(s.reset)}` : "" });
    else chats[tool].push({ from: "err", text: r.output || "That didn't go through. See Activity below." });
    render();
  } catch (err) {
    chats[tool].pop(); chats[tool].push({ from: "err", text: err.message }); renderChat(tool);
  } finally {
    button.disabled = !state?.tools?.[tool]?.installed;
    chats[tool] = chats[tool].filter((m) => !m.typing).slice(-20);
    try { localStorage.setItem("uf-chats", JSON.stringify(chats)); } catch {}
  }
}

async function refresh(first) {
  try {
    const fresh = await api("/api/status");
    state = fresh;
    if (first) for (const tool of Object.keys(TOOLS)) config[tool] = { ...DEFAULT, ...(state.config?.[tool] || {}) };
    render();
  } catch {
    const e = document.getElementById("engine"); e.classList.remove("on"); e.lastElementChild.textContent = "Panel closed";
  }
}

document.getElementById("logfilter").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  logFilter = b.dataset.v;
  for (const x of e.currentTarget.children) x.setAttribute("aria-pressed", String(x === b));
  renderLog();
});

build();
render();
refresh(true);
// Pick up new activity and the moving "now" line, without touching unsaved edits.
setInterval(() => { if (!saveTimer) refresh(false); }, 30000);
</script>
</body>
</html>
